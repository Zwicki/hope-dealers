[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/cloud-state"
  to = "/.netlify/functions/cloud-state"
  status = 200

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
